services:
  backend:
    build: ./backend
    environment:
      APPLYPILOT_ALLOWED_PROVIDER_ENDPOINTS: ${APPLYPILOT_ALLOWED_PROVIDER_ENDPOINTS:-}
      APPLYPILOT_AUTHORIZED_FEEDS: ${APPLYPILOT_AUTHORIZED_FEEDS:-}
      APPLYPILOT_CREDENTIAL_KEY: ${APPLYPILOT_CREDENTIAL_KEY:-}
      APPLYPILOT_SCHEDULER: ${APPLYPILOT_SCHEDULER:-1}
      APPLYPILOT_DATABASE_URL: ${APPLYPILOT_DATABASE_URL:-}
    volumes:
      - workspace:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s
    init: true

  frontend:
    build: ./frontend
    environment:
      APPLYPILOT_ORIGIN: ${APPLYPILOT_ORIGIN:-http://localhost:3000}
      APPLYPILOT_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${APPLYPILOT_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
    init: true

volumes:
  workspace:
