[project]
name = "applypilot-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.1",
  "cryptography==50.0.2",
  "httpx2==2.16.0",
  "fastapi==0.162.2",
  "psycopg[binary]==3.3.8",
  "pydantic==2.14.3",
  "pypdf==7.0.0",
  "python-docx==1.2.0",
  "reportlab==5.1.0",
  "sqlalchemy==2.1.8",
  "tzdata==2026.2",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["._*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
